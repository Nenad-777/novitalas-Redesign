name: Import approved Greenland visual

on:
  push:
    branches:
      - fix-greenland-approved-image

permissions:
  contents: write

jobs:
  import-image:
    if: ${{ !contains(github.event.head_commit.message, '[asset-import]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-greenland-approved-image
      - name: Download approved image
        shell: bash
        run: |
          set -euo pipefail
          if [ -f public/news/greenland-us-arctic.jpg ]; then
            echo "Asset already present."
            exit 0
          fi
          mkdir -p public/news
          curl -fL --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/2b700586-d915-4924-a286-5513360bf913.jpeg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNGM2ZmIzMThhNTExZmE4ZSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTk4ODc2MH0.MSlUDMvCQiLKzUh5a2iVKsCcbqJNpkercpyJpWbHLRA' -o public/news/greenland-us-arctic.jpg
          test -s public/news/greenland-us-arctic.jpg
          file public/news/greenland-us-arctic.jpg
      - name: Commit approved image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/news/greenland-us-arctic.jpg
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Add approved Greenland visual [asset-import]"
          git push origin HEAD:fix-greenland-approved-image
