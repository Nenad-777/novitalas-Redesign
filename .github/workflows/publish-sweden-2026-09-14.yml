name: Publish Sweden election 2026-09-14

on:
  push:
    paths:
      - '.github/workflows/publish-sweden-2026-09-14.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
      - name: Publish approved Sweden article
        run: python3 .publish/sweden_2026_09_14.py
      - name: Commit publication
        run: |
          git config user.name "Novi Talas Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish Sweden election feature"
          git push origin HEAD:main
