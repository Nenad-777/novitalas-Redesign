name: Publish Renoir feature

on:
  push:
    branches:
      - publish-renoir-2026-09-09
    paths:
      - .publish-renoir/trigger.txt

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved Novi Talas publication
        run: python .publish-renoir/publish_renoir.py

      - name: Commit final publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Renoir art-heist feature"
          git push origin HEAD:main
