name: Publish Novi Talas 2026-09-08

on:
  push:
    paths:
      - '.publish/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
      - name: Publish approved articles
        run: python3 .publish/publish.py
      - name: Commit publication
        run: |
          git config user.name "Novi Talas Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish maritime order and Pachocki AI stories"
          git push origin HEAD:main
