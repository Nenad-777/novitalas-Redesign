    <style>
      #nt3-opening {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        z-index: 2147483000;
        overflow: hidden;
        isolation: isolate;
        pointer-events: none;
        background: #020c1c;
        opacity: 1;
        transition: opacity 1080ms cubic-bezier(.26, .05, .52, 1);
      }
      #nt3-opening picture,
      #nt3-opening picture img {
        position: absolute;
        display: block;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #nt3-opening picture img {
        object-fit: cover;
        object-position: 62% center;
        opacity: 0;
        transform: scale(1);
        transform-origin: 59% 48%;
        transition:
          opacity 400ms cubic-bezier(.2, .55, .3, 1),
          transform 1600ms cubic-bezier(.16, .64, .23, 1);
        will-change: transform;
      }
      #nt3-opening.nt3-image-ready picture img { opacity: 1; }
      #nt3-opening .nt3-opening-vignette {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(2, 10, 24, .98) 0%, rgba(2, 10, 24, .98) 33%, rgba(2, 10, 24, .89) 49%, rgba(2, 10, 24, .24) 69%, transparent 90%),
          linear-gradient(0deg, rgba(2, 10, 24, .30), transparent 36%);
        opacity: 0;
        transition: opacity 350ms ease-out;
      }
      #nt3-opening.nt3-image-ready .nt3-opening-vignette { opacity: 1; }
      #nt3-opening .nt3-opening-mobile-brand {
        display: flex;
        position: absolute;
        z-index: 2;
        top: 38%;
        left: clamp(35px, 7vw, 110px);
        right: 18px;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        color: #fff;
        opacity: 0;
        filter: blur(0);
        transform: translate3d(0, 12px, 0) scale(.965);
        transform-origin: 15% 48%;
        transition:
          opacity 460ms ease-out,
          transform 1600ms cubic-bezier(.16, .64, .23, 1),
          filter 850ms ease-out;
        text-shadow: 0 2px 24px rgba(0, 4, 18, .6);
        will-change: transform, opacity;
      }
      #nt3-opening .nt3-opening-mobile-brand strong {
        font-family: "Playfair Display", Georgia, serif;
        font-weight: 700;
        font-size: clamp(46px, 7vw, 115px);
        line-height: 1.04;
        letter-spacing: -.055em;
        white-space: nowrap;
      }
      #nt3-opening .nt3-opening-mobile-brand span {
        font-family: "Lora", Georgia, serif;
        font-style: italic;
        font-size: clamp(17px, 2.3vw, 29px);
        letter-spacing: .03em;
      }
      #nt3-opening.nt3-image-ready .nt3-opening-mobile-brand {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
      /* The title advances into the camera; the background follows more slowly. */
      #nt3-opening.nt3-opening-zoom picture img {
        transform: scale(1.145);
      }
      #nt3-opening.nt3-opening-zoom .nt3-opening-mobile-brand {
        transform: translate3d(2vw, -1vh, 0) scale(1.56);
      }
      #nt3-opening.nt3-opening-fade {
        opacity: 0;
      }
      #nt3-opening.nt3-opening-fade .nt3-opening-mobile-brand {
        opacity: 0;
        filter: blur(2px);
      }
      @media (max-width: 900px) and (orientation: portrait) {
        #nt3-opening picture img {
          object-position: 88% center;
          transform-origin: 88% 50%;
        }
        #nt3-opening .nt3-opening-vignette {
          background:
            linear-gradient(180deg, rgba(2, 10, 24, .13) 0%, transparent 32%, rgba(2, 10, 24, .22) 53%, rgba(2, 10, 24, .83) 100%);
        }
        #nt3-opening .nt3-opening-mobile-brand {
          top: auto;
          bottom: calc(13vh + env(safe-area-inset-bottom, 0px));
          left: clamp(24px, 7vw, 52px);
          right: 14px;
          gap: 11px;
          transform-origin: 16% 62%;
        }
        #nt3-opening .nt3-opening-mobile-brand strong {
          font-size: clamp(32px, 9.7vw, 64px);
        }
        #nt3-opening .nt3-opening-mobile-brand span {
          font-size: clamp(16px, 4vw, 22px);
        }
        #nt3-opening.nt3-opening-zoom .nt3-opening-mobile-brand {
          transform: translate3d(2vw, -3vh, 0) scale(1.68);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #nt3-opening { display: none !important; }
      }
    </style>

  <body>
    <div id="nt3-opening" aria-hidden="true">
      <picture>
        <source srcset="/news/nt3-cinematic-opening-720.webp" media="(max-width: 900px)" />
        <img src="/news/nt3-cinematic-opening-1200.webp" width="1200" height="630" alt="" decoding="async" fetchpriority="high" />

    <div id="root"></div>
    <script>
      (() => {
        const intro = document.getElementById("nt3-opening");
        const root = document.getElementById("root");
        const img = intro && intro.querySelector("img");
        if (!intro || !root || !img) return;
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          intro.remove();
          return;
        }

        let pageReady = root.childElementCount > 0;
        let imageReady = false;
        let started = false;
        let finished = false;
        let observer;
        const timers = new Set();
        const later = (fn, ms) => {
          const id = window.setTimeout(() => { timers.delete(id); fn(); }, ms);
          timers.add(id);
          return id;
        };
        const finish = () => {
          if (finished) return;
          finished = true;
          if (observer) observer.disconnect();
          timers.forEach(id => window.clearTimeout(id));
          timers.clear();
          intro.remove();
        };
        const play = () => {
          if (started || finished || !pageReady || !imageReady) return;
          started = true;
          requestAnimationFrame(() => {
            if (finished) return;
            intro.classList.add("nt3-image-ready");
            // 0–750ms: breathe in. 750–1430ms: title moves toward the reader.
            // 1430–2510ms: full-screen crossfade reveals the destination page.
            later(() => {
              intro.classList.add("nt3-opening-zoom");
              later(() => {
                intro.classList.add("nt3-opening-fade");
                later(finish, 1140);
              }, 680);
            }, 750);
          });
        };
        const loaded = () => {
          if (finished || imageReady) return;
          imageReady = true;
          play();
        };
        const failed = () => finish();
        if (!pageReady) {
          observer = new MutationObserver(() => {
            if (root.childElementCount > 0) {
              pageReady = true;
              observer.disconnect();
              play();
            }
          });
          observer.observe(root, { childList: true });
        }
        img.addEventListener("load", loaded, { once: true });
        img.addEventListener("error", failed, { once: true });
        if (img.complete && img.naturalWidth > 0) loaded();
        else if (img.decode) img.decode().then(loaded, () => {
          if (img.complete && img.naturalWidth > 0) loaded();
        });

        // No intro may block the website if the image or app fails to load.
        later(finish, 4800);
      })();
    </script>
