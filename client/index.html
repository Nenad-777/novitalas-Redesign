    <style>
      #nt3-opening {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        z-index: 2147483000;
        overflow: hidden;
        background: #020c1c;
        pointer-events: none;
        opacity: 1;
        transition: opacity 790ms cubic-bezier(.33, 0, .5, 1);
        isolation: isolate;
      }
      #nt3-opening picture,
      #nt3-opening picture img {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #nt3-opening picture img {
        object-fit: cover;
        object-position: center center;
        opacity: 0;
        transform: scale(1.005);
        transform-origin: 56% 52%;
        transition:
          opacity 220ms ease-out,
          transform 1200ms cubic-bezier(.22, .72, .28, 1);
      }
      #nt3-opening.nt3-image-ready picture img {
        opacity: 1;
      }
      #nt3-opening .nt3-opening-vignette {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(2, 10, 22, .03) 10%, rgba(2, 10, 22, .04) 62%, rgba(2, 10, 22, .3) 100%);
        opacity: 0;
        transition: opacity 220ms ease-out;
      }
      #nt3-opening.nt3-image-ready .nt3-opening-vignette {
        opacity: 1;
      }
      #nt3-opening.nt3-opening-fade {
        opacity: 0;
      }
      #nt3-opening.nt3-opening-fade picture img {
        transform: scale(1.055);
      }
      #nt3-opening .nt3-opening-mobile-brand { display: none; }
      @media (max-width: 900px) and (orientation: portrait) {
        #nt3-opening picture img {
          object-position: 88% center;
          transform-origin: 88% 50%;
        }
        #nt3-opening .nt3-opening-vignette {
          background: linear-gradient(180deg, rgba(2, 10, 24, .14) 0%, transparent 36%, rgba(2, 10, 24, .3) 62%, rgba(2, 10, 24, .82) 100%);
        }
        #nt3-opening .nt3-opening-mobile-brand {
          display: flex;
          position: absolute;
          bottom: calc(10vh + env(safe-area-inset-bottom, 0px));
          left: clamp(24px, 7vw, 52px);
          right: 20px;
          flex-direction: column;
          gap: 11px;
          color: #fff;
          opacity: 0;
          transform: translateY(8px);
          transition: opacity 330ms ease-out 80ms, transform 400ms ease-out 80ms;
          text-shadow: 0 2px 18px rgba(0, 4, 18, .72);
        }
        #nt3-opening.nt3-image-ready .nt3-opening-mobile-brand {
          opacity: 1;
          transform: translateY(0);
        }
        #nt3-opening .nt3-opening-mobile-brand strong {
          font-family: "Playfair Display", Georgia, serif;
          font-weight: 700;
          font-size: clamp(32px, 9.7vw, 64px);
          letter-spacing: -.052em;
          line-height: 1.02;
          white-space: nowrap;
        }
        #nt3-opening .nt3-opening-mobile-brand span {
          font-family: "Lora", Georgia, serif;
          font-style: italic;
          font-size: clamp(16px, 4vw, 22px);
          letter-spacing: .035em;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #nt3-opening { display: none !important; }
      }
    </style>

  <body>
    <div id="nt3-opening" aria-hidden="true">
      <picture>
        <source srcset="/news/nt3-cinematic-opening-720.webp" media="(max-width: 900px)" />
        <img src="/news/nt3-cinematic-opening-1200.webp" width="1200" height="630" alt="" decoding="async" fetchpriority="high" />
      </picture>
      <div class="nt3-opening-vignette"></div>
      <div class="nt3-opening-mobile-brand">
        <strong>NOVI TALAS</strong>
        <span>Vaš prozor u svet</span>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const intro = document.getElementById("nt3-opening");
        const root = document.getElementById("root");
        const image = intro && intro.querySelector("img");
        if (!intro || !root || !image) return;

        const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (prefersReducedMotion) { intro.remove(); return; }

        let readyImage = false;
        let readyPage = root.childElementCount > 0;
        let started = false;
        let rootObserver;
        let holdTimer;
        let removeTimer;

        const finish = () => {
          if (rootObserver) rootObserver.disconnect();
          window.clearTimeout(holdTimer);
          window.clearTimeout(removeTimer);
          intro.remove();
        };
        const showWhenReady = () => {
          if (started || !readyImage || !readyPage) return;
          started = true;
          intro.classList.add("nt3-image-ready");
          // Allow the hero to settle into view, then dissolve the entire screen.
          holdTimer = window.setTimeout(() => {
            intro.classList.add("nt3-opening-fade");
            removeTimer = window.setTimeout(finish, 850);
          }, 440);
        };
        const imageLoaded = () => {
          if (readyImage || !intro.isConnected) return;
          readyImage = true;
          showWhenReady();
        };
        const imageFailed = () => finish();

        if (!readyPage) {
          rootObserver = new MutationObserver(() => {
            if (root.childElementCount > 0) {
              readyPage = true;
              rootObserver.disconnect();
              showWhenReady();
            }
          });
          rootObserver.observe(root, { childList: true });
        }

        image.addEventListener("load", imageLoaded, { once: true });
        image.addEventListener("error", imageFailed, { once: true });
        if (image.complete && image.naturalWidth > 0) {
          imageLoaded();
        } else if (image.decode) {
          image.decode().then(imageLoaded, () => {
            if (image.complete && image.naturalWidth > 0) imageLoaded();
          });
        }

        // A missing asset or failed page can never leave a full-screen mask.
        window.setTimeout(finish, 3000);
      })();
    </script>
